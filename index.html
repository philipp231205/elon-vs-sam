<!DOCTYPE html>

<html lang="en">
	<head>
		<meta charset = "UTF-8">
		<meta name = "viewport" content = "width=device-width, initial-scale=1.0">
		<title>Elon vs Sam</title>
		<meta name = "description" content = "Who can win the ultimate Showdown between Elon Musk and Sam Altman?">

		<style>
			@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

			body {
				font-family: 'Press Start 2P', cursive;
				margin: 0;
				padding: 0;
				overflow: hidden;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			#gameCanvas {
				width: 100vw;
				height: 100vh;
				display: block;
				background-image: url('assets/background.png');
				background-size: cover;
				background-position: center;
			}

			#gameContainer {
				position: relative;
				width: 100%;
				height: 100%;
				overflow: hidden;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			#SelectionScreen {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				background: rgba(255, 255, 255, 0.9);
				padding: 20px;
				border-radius: 10px;
				text-align: center;
				display: flex;
				flex-direction: column;
			}

			.card-container {
				display: flex;
				flex-direction: row;
				justify-content: center;
			}

			.selection-h1 {
				margin-bottom: 20px;
				font-size: 3vh;
			}

			.card {
				display: inline-block;
				width: 150px;
				margin: 0 20px;
				padding: 10px;
				border: 2px solid #333;
				border-radius: 10px;
				cursor: pointer;
				transition: transform 0.2s, box-shadow 0.2s;
			}

			.card-image {
				width: 100%;
				height: auto;
				border-radius: 10px;
			}

			.card:hover {
				transform: scale(1.05);
				box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
			}

			.card-h2 {
				margin-top: 10px;
				font-size: 2vh;
			}

			.selection-controls {
				margin-top: 20px;
				font-size: 2vh;
			}

			.hud {
				display: none; /* Will be shown during battle */
				position: absolute;
				top: 10px;
				width: 100%;
				justify-content: space-between;
				padding: 0 20px;
				box-sizing: border-box;
				color: white;
				text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
				font-size: 2vh;
				z-index: 10;
				align-items: center;
			}

			.player1-hud, .player2-hud {
				background: rgba(0, 0, 0, 0.5);
				padding: 2vh;
				border-radius: 5px;
				width: 20vw;
			}

			.player1-health, .player2-health {
				height: 20px;
				background: rgb(228, 38, 38);
				border-radius: 5px;
				margin-bottom: 10px;
				width: 100%; /* Will be updated dynamically */
			}

			.timer {
				font-size: 5vh;
				color: white;
				text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
			}

			.gameOverScreen {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				background: rgba(0, 0, 0, 0.8);
				color: white;
				padding: 30px;
				border-radius: 10px;
				text-align: center;
				display: none; /* Will be shown on game over */
				flex-direction: column;
				align-items: center;
				justify-content: center;
				row-gap: 2vh;
				z-index: 20;
			}

			.gameOverText {
				font-size: 4vh;
				margin-bottom: 20px;
			}

			.winnerName {
				font-size: 3vh;
				margin-bottom: 20px;
			}

			.playAgainButton {
				font-size: 2.5vh;
				font-family: 'Press Start 2P', cursive;
				padding: 10px 20px;
				background-color: transparent;
				border: 2px solid white;
				border-radius: 5px;
				cursor: pointer;
				transition: background 0.2s, color 0.2s;
				color: white;
			}

			.playAgainButton:hover {
				background-color: white;
				color: black;
			}

		</style>
	</head>

	<body>

		<div id = "gameContainer">
			<!-- Character Selection Screen-->
			<div class="SelectionScreen" id ="SelectionScreen">
				<h1 class="selection-h1">Choose your Fighter</h1>

				<div class = "card-container">
					<div class="card" onclick="startBattle('Elon Musk')">
						<img class = "card-image" src="assets/elon.png" alt="Elon Musk">
						<h2 class = "card-h2">Elon Musk</h2>
					</div>

					<div class="card" onclick="startBattle('Sam Altman')">
						<img class = "card-image" src="assets/sam.png" alt="Sam Altman">
						<h2 class = "card-h2">Sam Altman</h2>
					</div>
				</div>
				<p class = "selection-controls">
				WASD (Move/Jump) | SPACE (Melee)
				</p>
			</div>

			<canvas id = "gameCanvas"></canvas>

			<div id="hud" class="hud">
				<div class="player1-hud"> <!-- Health Container-->
					<div class="player1-health" id="player1-health"></div>
					<p class="player1-name">Elon Musk</p>
				</div>

				<div class="timer" id="timer"></div>

				<div class="player2-hud"> <!-- Health Container-->
					<div class="player2-health" id="player2-health"></div>
					<p class="player2-name">Sam Altman</p>
				</div>
			</div>

			<div id="gameOverScreen" class="gameOverScreen">
				<h1 class="gameOverText" id="gameOverText">Game Over</h1>
				<div class="winnerName" id="winnerName"></div>
				<button class="playAgainButton" onclick="location.reload()">Play Again</button>
			</div>
		</div>


		</canvas>

		<script>
			// Game config
			const CONFIG = {
				width: window.innerWidth,
				height: window.innerHeight,
				battleTime: 120, // seconds
				gravity: 0.5,
				characters: {
					elon: {
						name: 'Elon Musk',
						health: 370,
						attack: 17,
						speed: 6,
						jump_power: 12,
						ai_decisionCooldown: 30
					},
					sam: {
						name: 'Sam Altman',
						health: 350,
						attack: 15,
						speed: 9,
						jump_power: 14,
						ai_decisionCooldown: 50
					}
				}
			}

			// Character Class
			class Character {
				constructor(isAI, name, health, attack, speed, jump_power, aiDefaultDecisionCooldown) {
					this.isAI = isAI;
					this.name = name;
					this.health = health;
					this.maxHealth = health;
					this.attack = attack;
					this.speed = speed;
					this.jump_power = jump_power;

					this.x = 0;
					this.y = 0;
					this.width = window.innerWidth * 0.25;
					this.height = window.innerHeight * 0.5;

					this.velX = 0;
					this.velY = 0;

					this.isJumping = false;
					this.isAttacking = false;
					this.attackCooldown = 0;
					this.attackAnimationTime = 0;
					this.hitStunTime = 0;
					this.facingRight = true;

					// AI
					this.aiDecisionCooldown = 0;
					this.aiDefaultDecisionCooldown = aiDefaultDecisionCooldown || 30;
					this.aiWalking = false;
					this.aiWalkTarget = 0;
					this.aiJumping = false;
					this.aiAttacking = false;


					// Sprites
					this.spriteSheet = null;
					this.currentAnimation = 'idle';
					this.currentFrame = 0;
					this.frameTimer = 0;
					this.frameDelay = 5;

					this.animations = {
						idle: { row: 0, frames: 8, loop: true },
						walk: { row: 1, frames: 8, loop: true },
						jump: { row: 2, frames: 8, loop: false },
						attack: { row: 3, frames: 12, loop: false },
					};
					
					this.spriteWidth = 256;
					this.spriteHeight = 256;

					this.spriteSheet = new Image();
					this.spriteSheet.src = `assets/${this.name.toLowerCase().replace(' ', '')}.png`;
				}
				
				setAnimation(animationName) {
					// Only change if it's a different animation
					if (this.currentAnimation !== animationName && this.animations[animationName]) {
						this.currentAnimation = animationName;
						this.currentFrame = 0;
						this.frameTimer = 0;
					}
				}

				updateAnimation() {
					const anim = this.animations[this.currentAnimation];
					if (!anim) return;
					
					this.frameTimer++;
					
					// Time to switch to next frame?
					if (this.frameTimer >= this.frameDelay) {
						this.frameTimer = 0;
						this.currentFrame++;
						
						// Loop or stop at end
						if (this.currentFrame >= anim.frames) {
							if (anim.loop) {
								this.currentFrame = 0;
							} else {
								this.currentFrame = anim.frames - 1; // Stay on last frame
							}
						}
					}
				}
				
				determineAnimation() {
					// Priority system: higher priority animations override lower ones
					if (this.attackCooldown > 0) {
						this.setAnimation('attack');
					} else if (this.hitStunTime > 0) {
						this.setAnimation('hit');
					} else if (this.isJumping) {
						this.setAnimation('jump');
					} else if (Math.abs(this.velX) > 0.1) {
						this.setAnimation('walk');
					} else {
						this.setAnimation('idle');
					}
				}

				draw() {
					ctx.save();
					ctx.fillStyle = this.name === 'Elon Musk' ? 'transparent' : 'transparent';
					ctx.fillRect(this.x, this.y, this.width, this.height);

					this.drawSprite();

					ctx.restore();
				}

				drawSprite() {
					const anim = this.animations[this.currentAnimation];
					if (!anim) return;
					
					// Calculate source position in sprite sheet
					const sourceX = this.currentFrame * this.spriteWidth;
					const sourceY = anim.row * this.spriteHeight;
					
					// Handle flipping for direction
					if (!this.facingRight) {
						ctx.save();
						ctx.translate(this.x + this.width, this.y);
						ctx.scale(-1, 1);
						
						// Draw the sprite (flipped)
						ctx.drawImage(
							this.spriteSheet,
							sourceX, sourceY, this.spriteWidth, this.spriteHeight,  // Source
							0, 0, this.width, this.height                           // Destination
						);
						
						ctx.restore();
					} else {
						// Draw the sprite (normal)
						ctx.drawImage(
							this.spriteSheet,
							sourceX, sourceY, this.spriteWidth, this.spriteHeight,  // Source
							this.x, this.y, this.width, this.height                  // Destination
						);
					}
				}

				// FUTURE: AI CAPABLITIES

				update(opponent) {

					this.velX = 0;

					if (this.isAI) {
						this.updateAI(opponent);
					}

					// Controls
					if (!this.isAI) {
						if (keys['w'] && !this.isJumping) {
							this.velY -= this.jump_power;
							this.isJumping = true;
						}
						if (keys['a']) {
							this.velX -= this.speed;
							this.facingRight = false;
						}
						if (keys['d']) {
							this.velX += this.speed;
							this.facingRight = true;
						}
						if (keys[' ']) {
							this.doAttack();
						}
					}

					// Apply gravity
					this.velY += CONFIG.gravity;

					// Update position
					this.x += this.velX;
					this.y += this.velY;

					// Boundary checks

					if (this.y + this.height >= CONFIG.height) {
						this.y = CONFIG.height - this.height;
						this.isJumping = false;
						this.velY = 0;
					}

					if (this.x < 0) this.x = 0;
					if (this.x + this.width > CONFIG.width) this.x = CONFIG.width - this.width;
				
					// Attack cooldown
					if (this.attackCooldown > 0) {
						this.attackCooldown--;
						if (this.isAttacking) this.attackAnimationTime++;
					} else {
						this.isAttacking = false;
						this.attackAnimationTime = 0;
					}

					this.determineAnimation();
					this.updateAnimation();
				}

				// AI Decisions
				updateAI(opponent) {
					const distanceToOpp = opponent.x - this.x;

					if (this.aiDecisionCooldown <= 0) {
						// AI walking towards opponent if far away, otherwise random movement
						if (distanceToOpp > 50) {
							this.aiWalking = true;
							this.aiWalkTarget = opponent.x; // Walk right
						} else if (distanceToOpp < -50) {
							this.aiWalking = true;
							this.aiWalkTarget = opponent.x; // Walk left
						}

						// Random jump
						if (Math.random() < 0.01 && !this.isJumping) {
							this.aiJumping = true;
						}	

						// Attack if close
						if (Math.abs(distanceToOpp) < 60 && this.attackCooldown <= 0) {
							this.aiAttacking = true;
						}

						this.aiDecisionCooldown = this.aiDefaultDecisionCooldown + Math.floor(Math.random() * 15); // New decision every 0.5-1 seconds
					}

					this.aiDecisionCooldown--;


					// Perform actions based on decisions

					if (this.aiWalking) {
						if (distanceToOpp > 50) {
							this.velX += this.speed;
							this.facingRight = true;
						} else if (distanceToOpp < -50) {
							this.velX -= this.speed;
							this.facingRight = false;
						}

						if (Math.abs(distanceToOpp) < 10) {
							this.aiWalking = false; // Stop walking if close enough
						}
					}

					if (this.aiJumping) {
						this.velY -= this.jump_power;
						this.isJumping = true;
						this.aiJumping = false; // Reset jump decision
					}

					if (this.aiAttacking) {
						this.doAttack();
						this.aiAttacking = false; // Reset attack decision
					}
				}

				// Creates a rect for the body (hurtbox) — person occupies ~25% of sprite width (centered) and ~90% of sprite height (starting 5% from top)
				getBodyBox() {
					return {
						x: this.x + this.width * 0.375,
						y: this.y + this.height * 0.05,
						width: this.width * 0.25,
						height: this.height * 0.90
					};
				}

				// Creates a rect for the attack area — punch reaches ~40% of sprite width in facing direction, upper 50% of body only
				getAttackBox() {
					const bodyOffset = this.width * 0.375; // person left edge at 37.5% of sprite
					const attackWidth = this.width * 0.40;
					const boxY = this.y + this.height * 0.05;
					const boxH = this.height * 0.45; // top half of the 90% body height
					if (this.facingRight) {
						return {
							x: this.x + bodyOffset,
							y: boxY,
							width: attackWidth,
							height: boxH
						};
					} else {
						return {
							x: this.x + this.width - bodyOffset - attackWidth,
							y: boxY,
							width: attackWidth,
							height: boxH
						};
					}
				}

				// Sets attack state
				doAttack() {
					if (this.attackCooldown <= 0) {
						this.isAttacking = true;
						this.attackCooldown = 60; // Cooldown in frames
					}
				}
 			}

			// Game State

			const gameState = {
				phase: 'selection', // 'selection', 'battle', 'gameover'
				selections: {
					player1: null,
					player2: null
				},
				timeRemaining: CONFIG.battleTime || 120,
				winner: null
			}

			// Canvas setup
			const canvas = document.getElementById('gameCanvas');
			const ctx = canvas.getContext('2d');
			canvas.width = CONFIG.width;
			canvas.height = CONFIG.height;

			// Resizing
			window.addEventListener('resize', () => {
				canvas.width = window.innerWidth;
				canvas.height = window.innerHeight;
				CONFIG.width = window.innerWidth;
				CONFIG.height = window.innerHeight;
				render();
			});

			// Game Objects

			let player1 = null;
			let player2 = null;
			let timer = null;

			// Input Handling

			const keys = {};
			window.addEventListener('keydown', (e) => {
				keys[e.key] = true;
				if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
					e.preventDefault();
				}
			});
			window.addEventListener('keyup', (e) => {
				keys[e.key] = false;
			});

			// Start Battle

			function startBattle(player) {
				document.getElementById('SelectionScreen').style.display = 'none';
				document.getElementById('hud').style.display = 'flex';
				document.getElementById('timer').textContent = CONFIG.battleTime;

				if (player === 'Elon Musk') {
					gameState.selections.player1 = 'Elon Musk';
					gameState.selections.player2 = 'Sam Altman';
				} else {
					gameState.selections.player1 = 'Sam Altman';
					gameState.selections.player2 = 'Elon Musk';
				}

				gameState.phase = 'battle';
				if (player === 'Elon Musk') {
					player1 = new Character(false, CONFIG.characters.elon.name, CONFIG.characters.elon.health, CONFIG.characters.elon.attack, CONFIG.characters.elon.speed, CONFIG.characters.elon.jump_power, CONFIG.characters.elon.ai_decisionCooldown);
					player2 = new Character(true, CONFIG.characters.sam.name, CONFIG.characters.sam.health, CONFIG.characters.sam.attack, CONFIG.characters.sam.speed, CONFIG.characters.sam.jump_power, CONFIG.characters.sam.ai_decisionCooldown);
				} else {
					player1 = new Character(true, CONFIG.characters.elon.name, CONFIG.characters.elon.health, CONFIG.characters.elon.attack, CONFIG.characters.elon.speed, CONFIG.characters.elon.jump_power, CONFIG.characters.elon.ai_decisionCooldown);
					player2 = new Character(false, CONFIG.characters.sam.name, CONFIG.characters.sam.health, CONFIG.characters.sam.attack, CONFIG.characters.sam.speed, CONFIG.characters.sam.jump_power, CONFIG.characters.sam.ai_decisionCooldown);
				}

				player1.x = CONFIG.width * 0.25 - player1.width / 2;
				player1.y = CONFIG.height - player1.height;

				player2.x = CONFIG.width * 0.75 - player2.width / 2;
				player2.y = CONFIG.height - player2.height;
			
				// Start Timer

				timer = setInterval(() => {
					gameState.timeRemaining--;
					document.getElementById('timer').textContent = gameState.timeRemaining;

					if (gameState.timeRemaining <= 0) {
						endBattle('time');
					}
				}, 1000);

				gameLoop();
			}

			// Collision check of 2 rects
			function checkCollision(rect1, rect2) {
				return (
					rect1.x < rect2.x + rect2.width &&
					rect1.x + rect1.width > rect2.x &&
					rect1.y < rect2.y + rect2.height &&
					rect1.y + rect1.height > rect2.y
				);
			}

			// Game Loop
			function gameLoop() {
				if (gameState.phase !== 'battle') return;

				player1.update(player2);
				player2.update(player1);

				// Check for attacks
				if (player1.isAttacking) {
					const attackBox = player1.getAttackBox();
					if (checkCollision(attackBox, player2.getBodyBox())) {
						player2.health -= player1.attack;
						player1.isAttacking = false;
					}
				} else if (player2.isAttacking) {
					const attackBox = player2.getAttackBox();
					if (checkCollision(attackBox, player1.getBodyBox())) {
						player1.health -= player2.attack;
						player2.isAttacking = false;
					}
				}

				//player1.health--; // TEMP DAMAGE

				updateHealthBar('player1', player1);
				updateHealthBar('player2', player2);

				// Check for end conditions
				if (player1.health <= 0) {
					endBattle('p2');
				} else if (player2.health <= 0) {
					endBattle('p1');
				}

				render();
				requestAnimationFrame(gameLoop);
			}

			function updateHealthBar(player, character) {
				const healtPercent = (character.health / character.maxHealth) * 100;
				document.getElementById(`${player}-health`).style.width = `${healtPercent}%`;
			}

			// Render
			function render() {
				// Clear Canvas
				ctx.clearRect(0, 0, canvas.width, canvas.height);

				// FUTURE OBJECTS WILL BE DRAWN HERE TODO:

				// Draw Players
				player1.draw();
				player2.draw();
			}

			// End Battle
			function endBattle(reason) {
				updateHealthBar('player1', player1);
				updateHealthBar('player2', player2);

				clearInterval(timer);
				gameState.phase = 'gameover';

				let winner;
				if (reason === 'p1') {
					winner = 'Elon Musk wins!';
				} else if (reason === 'p2') {
					winner = 'Sam Altman wins!';
				} else {
					winner = 'It\'s a Draw!';
				}

				document.getElementById('gameOverScreen').style.display = 'flex';
				document.getElementById('winnerName').textContent = winner;
			}
			
		</script>
	</body>
</html>
