<!DOCTYPE html>

<html lang="en">
	<head>
		<meta charset = "UTF-8">
		<meta name = "viewport" content = "width=device-width, initial-scale=1.0">
		<title>Elon vs Sam</title>
		<meta name = "description" content = "Who can win the ultimate Showdown between Elon Musk and Sam Altman?">

		<link rel="stylesheet" href="styles/styles.css">
	</head>

	<body>

		<div id = "gameContainer">
			<!-- Character Selection Screen-->
			<div class="SelectionScreen" id ="SelectionScreen">

				<!-- Single Player vs Multiplayer Selection Screen-->
				<div class="SelectionScreenTabBar">
					<div class="SelectionScreenTab" id="SelectionSingle">
						Single
					</div>

					<div class="SelectionScreenTab" id="SelectionMultiplayer" style="color:#333; background-color: white;">
						Multi
					</div>
				</div>

				<div id="selection_singleplayer">
					<h1 class="selection-h1">Choose your Fighter</h1>

					<div class = "card-container">
						<div class="card" data-p1="Elon Musk">
							<img class = "card-image" src="assets/elon.png" alt="Elon Musk">
							<h2 class = "card-h2">Elon Musk</h2>
						</div>

						<div class="card" data-p1="Sam Altman">
							<img class = "card-image" src="assets/sam.png" alt="Sam Altman">
							<h2 class = "card-h2">Sam Altman</h2>
						</div>
					</div>
					<p class = "selection-controls">
					WASD (Move/Jump) | SPACE (Melee)
					</p>
				</div>

				<div id="selection_multiplayer" style="display:none">
					<h1 class="selection-h1">Choose Fighter for Player 1</h1>

					<div class = "card-container">
						<div class="card" data-p1="Elon Musk">
							<img class = "card-image" src="assets/elon.png" alt="Elon Musk">
							<h2 class = "card-h2">Elon Musk</h2>
						</div>

						<div class="card" data-p1="Sam Altman">
							<img class = "card-image" src="assets/sam.png" alt="Sam Altman">
							<h2 class = "card-h2">Sam Altman</h2>
						</div>
					</div>
					<p class = "selection-controls">
					Player 1: WASD (Move/Jump) | SPACE (Melee) <br>
					Player 2: Arrows (Move/Jump) | ENTER (Melee)
					</p>
				</div>
			</div>

			<canvas id = "gameCanvas"></canvas>

			<div id="hud" class="hud">
				<div class="player1-hud"> <!-- Health Container-->
					<div class="player1-health" id="player1-health"></div>
					<p class="player1-name">Elon Musk</p>
				</div>

				<div class="timer" id="timer"></div>

				<div class="player2-hud"> <!-- Health Container-->
					<div class="player2-health" id="player2-health"></div>
					<p class="player2-name">Sam Altman</p>
				</div>
			</div>

			<div id="gameOverScreen" class="gameOverScreen">
				<h1 class="gameOverText" id="gameOverText">Game Over</h1>
				<div class="winnerName" id="winnerName"></div>
				<button class="playAgainButton" onclick="location.reload()">Play Again</button>
			</div>
		</div>


		</canvas>

		<script type="module" src="scripts/main.js"></script>
	</body>
</html>
